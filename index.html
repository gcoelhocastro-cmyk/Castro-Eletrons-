<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Castro Elétrons - Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Manti seu CSS que está excelente, apenas pequenos ajustes de contraste */
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#070E1A;color:#E2EAF4;min-height:100vh}
        :root{--bg:#070E1A;--surface:#0D1B2E;--primary:#00E5A0;--accent:#F59E0B;--danger:#EF4444;--muted:#5A7A9A;--border:rgba(0,229,160,0.15);--radius:12px}
        #login-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
        .login-box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px 28px}
        .login-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:32px}
        .bolt-icon{width:56px;height:56px;background:rgba(0,229,160,0.1);border:2px solid var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px}
        .login-logo h1{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;letter-spacing:3px}
        .login-logo p{color:var(--muted);font-size:12px}
        .field{margin-bottom:14px}
        .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
        .field input{width:100%;padding:11px 13px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:#E2EAF4;font-size:14px;outline:none}
        .field input:focus{border-color:var(--primary)}
        .btn-login{width:100%;padding:13px;background:var(--primary);color:#000;border:none;border-radius:var(--radius);font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;cursor:pointer;margin-top:8px}
        #app{display:none;flex-direction:column;min-height:100vh}
        .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:11px 15px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
        .topbar-brand{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;letter-spacing:2px;color:var(--primary)}
        .main-content{flex:1;padding-bottom:76px}
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:50}
        .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:9px 4px 11px;cursor:pointer;color:var(--muted);font-size:9px;gap:3px;background:none;border:none}
        .nav-btn.active{color:var(--primary)}
        .screen{display:none;padding:14px}
        .screen.active{display:block}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
        .price-box{background:linear-gradient(135deg,rgba(0,229,160,0.1),transparent);border:1px solid var(--primary);border-radius:var(--radius);padding:14px;margin:10px 0;display:none}
        .price-box.show{display:block}
        .price-val{font-family:'Rajdhani',sans-serif;font-size:28px;font-weight:700;color:var(--primary)}
        .btn{padding:11px 14px;border-radius:var(--radius);font-size:12px;font-weight:600;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:5px;width:100%}
        .btn-green{background:var(--primary);color:#000}
        .btn-outline{background:none;border:1px solid var(--border);color:#E2EAF4}
        .item-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
        .total-bar{background:#112240;border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;margin-top:10px}
        .trow.main{font-size:17px;font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--primary)}
        .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;display:none;align-items:flex-end;justify-content:center}
        .modal-bg.show{display:flex}
        .modal{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:22px 18px;width:100%;max-height:88vh;overflow-y:auto}
        .toast{position:fixed;top:65px;left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:8px;font-size:12px;z-index:999;opacity:0;transition:0.3s}
        .toast.show{opacity:1}
        .toast.ok{background:var(--primary);color:#000}
        .toast.err{background:var(--danger);color:#fff}
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <div class="login-logo">
            <div class="bolt-icon">⚡</div>
            <h1>CASTRO ELÉTRONS</h1>
            <p>Sistema de Precificação Profissional</p>
        </div>
        <div class="field">
            <label>USUÁRIO</label>
            <input type="text" id="lu" placeholder="Gabriel27">
        </div>
        <div class="field">
            <label>SENHA</label>
            <input type="password" id="ls" placeholder="********">
        </div>
        <button class="btn-login" id="btn-login" onclick="login()">ENTRAR NO SISTEMA</button>
        <div id="login-erro" style="color:var(--danger); font-size:12px; margin-top:10px; text-align:center; display:none;"></div>
    </div>
</div>

<div id="app">
    <div class="topbar">
        <div class="topbar-brand">⚡ CASTRO ELÉTRONS</div>
        <button class="btn-sair" onclick="sair()" style="background:none; border:1px solid var(--border); color:var(--muted); padding:5px 10px; border-radius:8px; font-size:11px;">SAIR</button>
    </div>

    <div class="main-content">
        <div class="screen active" id="sc-venda">
            <div style="display:flex;gap:8px;margin-bottom:14px">
                <button class="btn btn-green" id="tab-calc" onclick="aba('calc')" style="flex:1">CALCULADORA</button>
                <button class="btn btn-outline" id="tab-cart" onclick="aba('cart')" style="flex:1">CARRINHO <span id="badge"></span></button>
            </div>

            <div id="p-calc">
                <div class="card">
                    <div class="ig"><label>Nome do Produto</label><input type="text" id="c-nome" class="sinput" style="width:100%; padding:10px; margin-bottom:10px; background:#070E1A; border:1px solid var(--border); color:#fff; border-radius:8px;"></div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <div><label style="font-size:11px; color:var(--muted)">Custo R$</label><input type="number" id="c-custo" oninput="calc()" style="width:100%; padding:10px; background:#070E1A; border:1px solid var(--border); color:#fff; border-radius:8px;"></div>
                        <div><label style="font-size:11px; color:var(--muted)">Frete R$</label><input type="number" id="c-frete" oninput="calc()" style="width:100%; padding:10px; background:#070E1A; border:1px solid var(--border); color:#fff; border-radius:8px;"></div>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
                        <div><label style="font-size:11px; color:var(--muted)">Taxa %</label><input type="number" id="c-taxa" oninput="calc()" style="width:100%; padding:10px; background:#070E1A; border:1px solid var(--border); color:#fff; border-radius:8px;"></div>
                        <div><label style="font-size:11px; color:var(--muted)">Lucro %</label><input type="number" id="c-lucro" oninput="calc()" style="width:100%; padding:10px; background:#070E1A; border:1px solid var(--border); color:#fff; border-radius:8px;"></div>
                    </div>
                </div>

                <div class="price-box" id="price-box">
                    <div style="font-size:11px;color:var(--muted);margin-bottom:3px">PREÇO SUGERIDO</div>
                    <div class="price-val" id="price-val">R$ 0,00</div>
                    <div id="b-info" style="font-size:11px; margin-top:5px; color:var(--primary)"></div>
                </div>

                <button class="btn btn-green" id="btn-salvar" onclick="salvar()" disabled style="margin-bottom:20px">SALVAR NO ESTOQUE</button>
                
                <div style="font-weight:bold; margin-bottom:10px; font-size:14px; letter-spacing:1px;">CATÁLOGO</div>
                <input type="text" class="sinput" placeholder="Buscar produto..." oninput="filtrarCat(this.value)" style="width:100%; padding:12px; background:var(--surface); border:1px solid var(--border); color:#fff; border-radius:10px; margin-bottom:10px;">
                <div id="lista-cat"></div>
            </div>

            <div id="p-cart" style="display:none">
                <div class="card">
                    <div class="field"><label>NOME DO CLIENTE</label><input type="text" id="c-cliente" placeholder="Ex: João Silva"></div>
                    <div class="field"><label>WHATSAPP (DDD + NÚMERO)</label><input type="tel" id="c-wpp" placeholder="91991888312"></div>
                </div>
                <div id="cart-vazio" style="text-align:center; padding:40px; color:var(--muted);">Carrinho vazio</div>
                <div id="cart-lista"></div>
                <div id="atend-lista"></div>
                <button class="btn btn-outline" onclick="abrirAtend()" style="margin-top:10px; border-color:var(--accent); color:var(--accent);">+ ADICIONAR SERVIÇO TÉCNICO</button>
                
                <div id="total-bar" class="total-bar" style="display:none">
                    <div class="trow" style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px;"><span>Produtos</span><span id="t-prod">R$ 0,00</span></div>
                    <div class="trow" style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:10px;"><span>Serviços</span><span id="t-atend">R$ 0,00</span></div>
                    <div class="trow main" style="display:flex; justify-content:space-between; border-top:1px solid var(--border); pt-10"><span>TOTAL</span><span id="t-total">R$ 0,00</span></div>
                    <button class="btn btn-green" onclick="finalizar()" id="btn-fin" style="margin-top:15px; height:50px; font-size:14px;">FINALIZAR E GERAR WHATSAPP</button>
                </div>
            </div>
        </div>

        <div class="screen" id="sc-estoque">
            <input type="text" class="sinput" placeholder="Pesquisar no estoque..." oninput="filtrarEst(this.value)" style="width:100%; padding:12px; background:var(--surface); border:1px solid var(--border); color:#fff; border-radius:10px; margin-bottom:15px;">
            <div id="lista-est"></div>
        </div>
        <div class="screen" id="sc-pedidos"><div id="lista-ped"></div></div>
        <div class="screen" id="sc-rel"><div id="rel-content"></div></div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" id="nav-venda" onclick="nav('venda')"><span>💰</span>Venda</button>
        <button class="nav-btn" id="nav-estoque" onclick="nav('estoque')"><span>📦</span>Estoque</button>
        <button class="nav-btn" id="nav-pedidos" onclick="nav('pedidos')"><span>📑</span>Pedidos</button>
        <button class="nav-btn" id="nav-rel" onclick="nav('rel')"><span>📊</span>Relatório</button>
    </nav>
</div>

<div class="modal-bg" id="m-atend">
    <div class="modal">
        <h3>Atendimento Técnico</h3>
        <input type="text" id="a-desc" placeholder="Descrição do serviço" class="sinput" style="width:100%; padding:12px; margin-bottom:10px; background:var(--bg); border:1px solid var(--border); color:#fff; border-radius:8px;">
        <input type="number" id="a-val" placeholder="Valor R$" class="sinput" style="width:100%; padding:12px; margin-bottom:15px; background:var(--bg); border:1px solid var(--border); color:#fff; border-radius:8px;">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <button class="btn btn-outline" onclick="fechar('m-atend')">CANCELAR</button>
            <button class="btn btn-green" onclick="addAtend()">ADICIONAR</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// --- CONFIGURAÇÃO SUPABASE ---
const SB_URL = 'https://unhjleupkfimqqngazpa.supabase.co';
const SB_KEY = 'sb_publishable_1PCUdcINjEA0NVksJez-QA_ZkbdY_8W'; 
const sb = supabase.createClient(SB_URL, SB_KEY);

// --- VARIÁVEIS GLOBAIS ---
let cat = [], cart = [], atends = [], precoSugerido = 0, user = null;

// --- LOGIN ---
async function login() {
    const u = document.getElementById('lu').value.trim();
    const s = document.getElementById('ls').value;
    const btn = document.getElementById('btn-login');
    const err = document.getElementById('login-erro');

    if(!u || !s) return toast('Preencha tudo!', 'err');
    
    btn.disabled = true; btn.textContent = 'CARREGANDO...';
    
    const { data, error } = await sb.from('usuarios').select().eq('usuario', u).eq('senha', s).single();

    if (error || !data) {
        err.style.display = 'block';
        err.textContent = 'Usuário ou senha incorretos!';
        btn.disabled = false; btn.textContent = 'ENTRAR NO SISTEMA';
    } else {
        user = data;
        localStorage.setItem('castro_user', JSON.stringify(data));
        startApp();
    }
}

function startApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    loadCat();
}

function sair() {
    localStorage.removeItem('castro_user');
    location.reload();
}

// --- NAVEGAÇÃO ---
function nav(t) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('active'));
    document.getElementById('sc-'+t).classList.add('active');
    document.getElementById('nav-'+t).classList.add('active');
    if(t === 'estoque') loadEst();
}

function aba(t) {
    const isCalc = t === 'calc';
    document.getElementById('p-calc').style.display = isCalc ? 'block' : 'none';
    document.getElementById('p-cart').style.display = isCalc ? 'none' : 'block';
    document.getElementById('tab-calc').className = 'btn ' + (isCalc ? 'btn-green' : 'btn-outline');
    document.getElementById('tab-cart').className = 'btn ' + (!isCalc ? 'btn-green' : 'btn-outline');
    if(!isCalc) renderCart();
}

// --- CÁLCULOS ---
function calc() {
    const custo = parseFloat(document.getElementById('c-custo').value) || 0;
    const frete = parseFloat(document.getElementById('c-frete').value) || 0;
    const taxa = (parseFloat(document.getElementById('c-taxa').value) || 0) / 100;
    const lucro = (parseFloat(document.getElementById('c-lucro').value) || 0) / 100;
    
    const totalCusto = custo + frete;
    const divisor = 1 - (taxa + lucro);

    if (totalCusto > 0 && divisor > 0) {
        precoSugerido = totalCusto / divisor;
        document.getElementById('price-val').textContent = f(precoSugerido);
        document.getElementById('b-info').textContent = `Custo Total: ${f(totalCusto)} | Margem Líquida Aplicada`;
        document.getElementById('price-box').classList.add('show');
        document.getElementById('btn-salvar').disabled = false;
    } else {
        document.getElementById('price-box').classList.remove('show');
        document.getElementById('btn-salvar').disabled = true;
    }
}

// --- BANCO DE DADOS (PRODUTOS) ---
async function salvar() {
    const nome = document.getElementById('c-nome').value.trim();
    if(!nome) return toast('Dê um nome ao produto', 'err');

    const btn = document.getElementById('btn-salvar');
    btn.disabled = true; btn.textContent = 'SALVANDO...';

    const { error } = await sb.from('produtos').insert({
        nome: nome.toUpperCase(),
        custo: parseFloat(document.getElementById('c-custo').value) || 0,
        frete: parseFloat(document.getElementById('c-frete').value) || 0,
        taxa_percent: parseFloat(document.getElementById('c-taxa').value) || 0,
        lucro_percent: parseFloat(document.getElementById('c-lucro').value) || 0,
        preco_venda: precoSugerido
    });

    if(error) {
        toast('Erro ao salvar no banco!', 'err');
    } else {
        toast('Produto salvo com sucesso!', 'ok');
        ['c-nome','c-custo','c-frete','c-taxa','c-lucro'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('price-box').classList.remove('show');
        loadCat();
    }
    btn.disabled = false; btn.textContent = 'SALVAR NO ESTOQUE';
}

async function loadCat() {
    const { data } = await sb.from('produtos').select().order('nome');
    cat = data || [];
    renderCatList(cat);
}

function renderCatList(lista) {
    const div = document.getElementById('lista-cat');
    div.innerHTML = lista.map(p => `
        <div class="item-row">
            <div>
                <div style="font-weight:600; font-size:13px">${p.nome}</div>
                <div style="font-size:10px; color:var(--muted)">Venda: ${f(p.preco_venda)}</div>
            </div>
            <button class="btn btn-green" onclick="addCart('${p.id}')" style="width:40px; height:30px; padding:0">+</button>
        </div>
    `).join('');
}

function filtrarCat(val) {
    const filtrados = cat.filter(p => p.nome.toLowerCase().includes(val.toLowerCase()));
    renderCatList(filtrados);
}

// --- CARRINHO ---
function addCart(id) {
    const p = cat.find(x => x.id === id);
    cart.push({...p, tempId: Date.now()});
    updBadge();
    toast('Adicionado!', 'ok');
}

function updBadge() {
    document.getElementById('badge').textContent = cart.length > 0 ? `(${cart.length})` : '';
}

function renderCart() {
    const listaDiv = document.getElementById('cart-lista');
    const atendDiv = document.getElementById('atend-lista');
    
    if(cart.length === 0 && atends.length === 0) {
        document.getElementById('cart-vazio').style.display = 'block';
        document.getElementById('total-bar').style.display = 'none';
        listaDiv.innerHTML = ''; atendDiv.innerHTML = '';
        return;
    }

    document.getElementById('cart-vazio').style.display = 'none';
    document.getElementById('total-bar').style.display = 'block';

    listaDiv.innerHTML = cart.map(i => `
        <div class="item-row">
            <span>${i.nome}</span>
            <div style="display:flex; align-items:center; gap:10px">
                <span style="color:var(--primary); font-weight:bold">${f(i.preco_venda)}</span>
                <button onclick="remCart(${i.tempId})" style="background:none; border:none; color:var(--danger)">✕</button>
            </div>
        </div>
    `).join('');

    atendDiv.innerHTML = atends.map((a, idx) => `
        <div class="item-row" style="border-left: 2px solid var(--accent); padding-left:10px">
            <span>🔧 ${a.descricao}</span>
            <div style="display:flex; align-items:center; gap:10px">
                <span style="color:var(--accent)">${f(a.valor)}</span>
                <button onclick="remAtend(${idx})" style="background:none; border:none; color:var(--danger)">✕</button>
            </div>
        </div>
    `).join('');

    const totalProd = cart.reduce((s, i) => s + i.preco_venda, 0);
    const totalAtend = atends.reduce((s, a) => s + a.valor, 0);
    
    document.getElementById('t-prod').textContent = f(totalProd);
    document.getElementById('t-atend').textContent = f(totalAtend);
    document.getElementById('t-total').textContent = f(totalProd + totalAtend);
}

function remCart(tid) { cart = cart.filter(i => i.tempId !== tid); renderCart(); updBadge(); }
function remAtend(idx) { atends.splice(idx, 1); renderCart(); }

function abrirAtend() { document.getElementById('m-atend').classList.add('show'); }
function fechar(id) { document.getElementById(id).classList.remove('show'); }

function addAtend() {
    const d = document.getElementById('a-desc').value;
    const v = parseFloat(document.getElementById('a-val').value);
    if(d && v) {
        atends.push({descricao: d, valor: v});
        fechar('m-atend');
        renderCart();
        document.getElementById('a-desc').value = '';
        document.getElementById('a-val').value = '';
    }
}

// --- FINALIZAÇÃO E WHATSAPP ---
async function finalizar() {
    const cliente = document.getElementById('c-cliente').value.trim();
    const wpp = document.getElementById('c-wpp').value.trim().replace(/\D/g,'');
    
    if(!cliente) return toast('Nome do cliente obrigatório!', 'err');
    
    const total = cart.reduce((s, i) => s + i.preco_venda, 0) + atends.reduce((s, a) => s + a.valor, 0);
    
    // Texto do WhatsApp com o "Discurso Chave"
    let itensTexto = cart.map(i => `✅ *${i.nome}* - ${f(i.preco_venda)}`).join('\n');
    if(atends.length > 0) {
        itensTexto += '\n\n*SERVIÇOS TÉCNICOS:*\n' + atends.map(a => `🔧 ${a.descricao} - ${f(a.valor)}`).join('\n');
    }

    const msg = `🚀 *PEDIDO FINALIZADO - CASTRO ELÉTRONS* 🚀\n\nOlá, *${cliente}*! É um prazer ver você equipar sua rotina com o melhor da tecnologia. Muito obrigado pela confiança!\n\n*RESUMO DO PEDIDO:*\n${itensTexto}\n\n💰 *TOTAL: ${f(total)}*\n\n--- \n💳 *PAGAMENTO:*\n• *PIX:* 91991888312 (Gabriel Castro)\n• *Espécie: em mãos*\n\n⚡ *DICA:* Guarde essa mensagem! Clientes fiéis da *Castro Elétrons* têm prioridade absoluta em novos estoques e descontos no próximo upgrade. \n\nQual a melhor forma de pagamento para você agora?`;

    // Salvar no Banco
    const { data: ped, error } = await sb.from('pedidos').insert({
        cliente_nome: cliente,
        cliente_wpp: wpp,
        total_venda: total,
        status: 'finalizado'
    }).select().single();

    if(!error) {
        window.open(`https://wa.me/55${wpp}?text=${encodeURIComponent(msg)}`, '_blank');
        toast('Pedido concluído!', 'ok');
        cart = []; atends = [];
        document.getElementById('c-cliente').value = '';
        document.getElementById('c-wpp').value = '';
        aba('calc');
    } else {
        toast('Erro ao salvar pedido!', 'err');
    }
}

// --- AUXILIARES ---
function f(v) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v); }

function toast(m, t) {
    const el = document.getElementById('toast');
    el.textContent = m;
    el.className = `toast ${t} show`;
    setTimeout(() => el.classList.remove('show'), 3000);
}

// Checar sessão ao abrir
const savedUser = localStorage.getItem('castro_user');
if(savedUser) {
    user = JSON.parse(savedUser);
    startApp();
}
</script>

</body>
</html>
