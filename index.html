<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Castro Elétrons - Gestão PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#070E1A;color:#E2EAF4;min-height:100vh}
        :root{--bg:#070E1A;--surface:#0D1B2E;--primary:#00E5A0;--accent:#F59E0B;--danger:#EF4444;--muted:#5A7A9A;--border:rgba(0,229,160,0.15);--radius:12px}
        
        /* Telas */
        #login-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
        .login-box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px 28px; text-align:center}
        #app{display:none;flex-direction:column;min-height:100vh}
        
        .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:11px 15px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
        .screen{display:none;padding:14px; padding-bottom:100px}
        .screen.active{display:block}
        
        /* Componentes */
        .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
        .sinput{width:100%; padding:12px; background:#070E1A; border:1px solid var(--border); color:#fff; border-radius:8px; margin-bottom:10px; outline:none}
        .sinput:focus{border-color:var(--primary)}
        
        .btn{padding:12px; border-radius:var(--radius); font-size:12px; font-weight:600; cursor:pointer; border:none; display:flex; align-items:center; justify-content:center; gap:5px; transition: 0.2s}
        .btn-green{background:var(--primary); color:#000}
        .btn-outline{background:none; border:1px solid var(--border); color:#E2EAF4}
        .btn-danger{background:rgba(239, 68, 68, 0.1); border:1px solid var(--danger); color:var(--danger)}
        
        .price-box{background:linear-gradient(135deg,rgba(0,229,160,0.1),transparent); border:1px solid var(--primary); border-radius:var(--radius); padding:15px; margin:10px 0; display:none}
        .price-box.show{display:block}
        
        .item-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.05)}
        .low-stock{color: var(--danger); font-weight: bold; animation: pulse 2s infinite}
        @keyframes pulse { 0% {opacity: 1} 50% {opacity: 0.5} 100% {opacity: 1} }

        .bottom-nav{position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); display:flex; z-index:50; padding:5px 0}
        .nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; background:none; border:none; color:var(--muted); font-size:10px; cursor:pointer}
        .nav-btn.active{color:var(--primary)}
        
        .toast{position:fixed; top:20px; left:50%; transform:translateX(-50%); padding:12px 20px; border-radius:8px; z-index:1000; display:none}
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h1>⚡ CASTRO ELÉTRONS</h1>
        <input type="text" id="lu" placeholder="Usuário" class="sinput" style="margin-top:20px">
        <input type="password" id="ls" placeholder="Senha" class="sinput">
        <button class="btn btn-green" style="width:100%" onclick="login()">ACESSAR PAINEL</button>
    </div>
</div>

<div id="app">
    <div class="topbar">
        <div style="font-family:'Rajdhani'; font-weight:700; color:var(--primary)">⚡ CASTRO ELÉTRONS</div>
        <button onclick="sair()" style="background:none; border:1px solid var(--border); color:var(--muted); padding:5px 10px; border-radius:6px; font-size:10px">SAIR</button>
    </div>

    <div class="main-content">
        <div class="screen active" id="sc-venda">
            <div style="display:flex; gap:8px; margin-bottom:15px">
                <button class="btn btn-green" id="tab-calc" onclick="aba('calc')" style="flex:1">CALCULADORA</button>
                <button class="btn btn-outline" id="tab-cart" onclick="aba('cart')" style="flex:1">CARRINHO <span id="badge"></span></button>
            </div>

            <div id="p-calc">
                <div class="card">
                    <label style="font-size:11px; color:var(--muted)">PRODUTO</label>
                    <input type="text" id="c-nome" class="sinput" placeholder="Ex: Smartwatch D20">
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
                        <input type="number" id="c-custo" placeholder="Custo R$" class="sinput" oninput="calc()">
                        <input type="number" id="c-qtd" placeholder="Qtd Inicial" class="sinput">
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px">
                        <input type="number" id="c-frete" placeholder="Frete" class="sinput" oninput="calc()">
                        <input type="number" id="c-taxa" placeholder="Taxa %" class="sinput" oninput="calc()">
                        <input type="number" id="c-lucro" placeholder="Lucro %" class="sinput" oninput="calc()">
                    </div>
                </div>
                <div class="price-box" id="price-box">
                    <div style="font-size:10px; color:var(--muted)">SUGESTÃO DE VENDA</div>
                    <div id="price-val" style="font-size:24px; font-weight:bold; color:var(--primary)">R$ 0,00</div>
                </div>
                <button class="btn btn-green" id="btn-salvar" onclick="salvar()" disabled style="width:100%; margin-bottom:20px">CADASTRAR NO ESTOQUE</button>
                
                <div style="font-weight:bold; font-size:12px; margin-bottom:10px">CATÁLOGO DISPONÍVEL</div>
                <div id="lista-cat"></div>
            </div>

            <div id="p-cart" style="display:none">
                <input type="text" id="c-cliente" placeholder="Nome do Cliente" class="sinput">
                <input type="tel" id="c-wpp" placeholder="WhatsApp (919...)" class="sinput">
                <div id="cart-lista"></div>
                <div id="total-bar" class="card" style="margin-top:15px; border-color:var(--primary); display:none">
                    <div style="display:flex; justify-content:space-between"><span>TOTAL:</span><span id="t-total" style="font-weight:bold; color:var(--primary)">R$ 0,00</span></div>
                    <button class="btn btn-green" style="width:100%; margin-top:10px" onclick="finalizar()">FINALIZAR VENDA</button>
                </div>
            </div>
        </div>

        <div class="screen" id="sc-estoque">
            <h3 style="margin-bottom:15px">📦 Controle de Estoque</h3>
            <div id="lista-est"></div>
        </div>

        <div class="screen" id="sc-pedidos">
            <h3 style="margin-bottom:15px">📑 Pedidos Realizados</h3>
            <div id="lista-ped"></div>
        </div>

        <div class="screen" id="sc-rel">
            <h3 style="margin-bottom:15px">📊 Performance de Vendas</h3>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:20px">
                <button class="btn btn-outline" onclick="gerarRelatorio('mes')">ESTE MÊS</button>
                <button class="btn btn-outline" onclick="gerarRelatorio('semestre')">SEMESTRE</button>
            </div>
            <div id="rel-stats" class="card" style="display:none">
                <div id="rel-titulo" style="font-weight:bold; color:var(--primary); margin-bottom:10px"></div>
                <div style="display:flex; justify-content:space-between"><span>Vendas:</span><span id="r-total"></span></div>
                <div style="display:flex; justify-content:space-between"><span>Qtd Pedidos:</span><span id="r-qtd"></span></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" id="nav-venda" onclick="nav('venda')"><span>💰</span>Venda</button>
        <button class="nav-btn" id="nav-estoque" onclick="nav('estoque')"><span>📦</span>Estoque</button>
        <button class="nav-btn" id="nav-pedidos" onclick="nav('pedidos')"><span>📑</span>Pedidos</button>
        <button class="nav-btn" id="nav-rel" onclick="nav('rel')"><span>📊</span>Relatórios</button>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient('https://unhjleupkfimqqngazpa.supabase.co', 'sb_publishable_1PCUdcINjEA0NVksJez-QA_ZkbdY_8W');
let cat = [], cart = [], precoSugerido = 0;

// --- LOGIN & START ---
async function login() {
    const u = document.getElementById('lu').value;
    const s = document.getElementById('ls').value;
    const { data, error } = await sb.from('usuarios').select().eq('usuario', u).eq('senha', s).single();
    if(data) { document.getElementById('login-screen').style.display='none'; document.getElementById('app').style.display='flex'; loadCat(); }
    else alert("Erro no login!");
}

function nav(t) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('active'));
    document.getElementById('sc-'+t).classList.add('active');
    document.getElementById('nav-'+t).classList.add('active');
    if(t === 'estoque') loadEst();
    if(t === 'pedidos') loadPeds();
}

function aba(t) {
    document.getElementById('p-calc').style.display = t==='calc' ? 'block' : 'none';
    document.getElementById('p-cart').style.display = t==='cart' ? 'block' : 'none';
    renderCart();
}

// --- LOGICA DE PRODUTOS ---
function calc() {
    const custo = parseFloat(document.getElementById('c-custo').value) || 0;
    const frete = parseFloat(document.getElementById('c-frete').value) || 0;
    const taxa = (parseFloat(document.getElementById('c-taxa').value) || 0)/100;
    const lucro = (parseFloat(document.getElementById('c-lucro').value) || 0)/100;
    const divisor = 1 - (taxa + lucro);
    if(divisor > 0) {
        precoSugerido = (custo + frete) / divisor;
        document.getElementById('price-val').textContent = f(precoSugerido);
        document.getElementById('price-box').classList.add('show');
        document.getElementById('btn-salvar').disabled = false;
    }
}

async function salvar() {
    const nome = document.getElementById('c-nome').value.toUpperCase();
    const qtd = parseInt(document.getElementById('c-qtd').value) || 0;
    const { error } = await sb.from('produtos').insert({
        nome, preco_venda: precoSugerido, quantidade: qtd, 
        custo: parseFloat(document.getElementById('c-custo').value), frete: parseFloat(document.getElementById('c-frete').value)
    });
    if(!error) { alert("Produto Salvo!"); loadCat(); }
}

async function loadCat() {
    const { data } = await sb.from('produtos').select().order('nome');
    cat = data || [];
    document.getElementById('lista-cat').innerHTML = cat.map(p => `
        <div class="item-row">
            <span>${p.nome} (${p.quantidade} un)</span>
            <button class="btn btn-green" onclick="addCart('${p.id}')" style="padding:5px 10px">+</button>
        </div>
    `).join('');
}

// --- ESTOQUE ---
async function loadEst() {
    const { data } = await sb.from('produtos').select().order('quantidade');
    document.getElementById('lista-est').innerHTML = data.map(p => `
        <div class="card" style="display:flex; justify-content:space-between; align-items:center">
            <div>
                <div style="font-weight:bold">${p.nome}</div>
                <div style="font-size:12px; color:var(--muted)">Preço: ${f(p.preco_venda)}</div>
            </div>
            <div class="${p.quantidade < 3 ? 'low-stock' : ''}" style="font-size:18px">
                ${p.quantidade} <small style="font-size:10px">un</small>
            </div>
        </div>
    `).join('');
}

// --- CARRINHO & PEDIDOS ---
function addCart(id) {
    const p = cat.find(x => x.id === id);
    if(p.quantidade <= 0) return alert("Estoque esgotado!");
    cart.push(p);
    document.getElementById('badge').textContent = `(${cart.length})`;
}

function renderCart() {
    const div = document.getElementById('cart-lista');
    div.innerHTML = cart.map((i, idx) => `<div class="item-row"><span>${i.nome}</span><span>${f(i.preco_venda)}</span></div>`).join('');
    const total = cart.reduce((s, i) => s + i.preco_venda, 0);
    document.getElementById('t-total').textContent = f(total);
    document.getElementById('total-bar').style.display = cart.length ? 'block' : 'none';
}

async function finalizar() {
    const cliente = document.getElementById('c-cliente').value;
    const wpp = document.getElementById('c-wpp').value;
    const total = cart.reduce((s, i) => s + i.preco_venda, 0);
    
    const { data, error } = await sb.from('pedidos').insert({ cliente_nome: cliente, cliente_wpp: wpp, total_venda: total }).select().single();
    
    if(!error) {
        // Baixar estoque
        for(let item of cart) {
            await sb.from('produtos').update({ quantidade: item.quantidade - 1 }).eq('id', item.id);
        }
        alert("Pedido Finalizado!");
        cart = []; document.getElementById('badge').textContent = '';
        aba('calc');
    }
}

async function loadPeds() {
    const { data } = await sb.from('pedidos').select().order('criado_em', {ascending: false});
    document.getElementById('lista-ped').innerHTML = data.map(p => `
        <div class="card">
            <div style="display:flex; justify-content:space-between">
                <strong>${p.cliente_nome}</strong>
                <span style="color:var(--primary)">${f(p.total_venda)}</span>
            </div>
            <div style="font-size:10px; color:var(--muted); margin: 5px 0">${new Date(p.criado_em).toLocaleDateString()}</div>
            <button class="btn btn-danger" style="width:100%; padding:5px; font-size:10px" onclick="cancelarPedido('${p.id}')">CANCELAR / APAGAR</button>
        </div>
    `).join('');
}

async function cancelarPedido(id) {
    if(confirm("Deseja realmente apagar este pedido? Isso não devolverá os itens ao estoque automaticamente.")) {
        await sb.from('pedidos').delete().eq('id', id);
        loadPeds();
    }
}

// --- RELATÓRIOS ---
async function gerarRelatorio(tipo) {
    const agora = new Date();
    let dataInicio;
    if(tipo === 'mes') dataInicio = new Date(agora.getFullYear(), agora.getMonth(), 1);
    else dataInicio = new Date(agora.getFullYear(), agora.getMonth() - 6, 1);

    const { data } = await sb.from('pedidos').select().gte('criado_em', dataInicio.toISOString());
    
    const total = data.reduce((s, p) => s + p.total_venda, 0);
    document.getElementById('rel-stats').style.display = 'block';
    document.getElementById('rel-titulo').textContent = tipo === 'mes' ? 'RELATÓRIO MENSAL' : 'RELATÓRIO SEMESTRAL';
    document.getElementById('r-total').textContent = f(total);
    document.getElementById('r-qtd').textContent = data.length;
}

function f(v) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v); }
function sair() { location.reload(); }
</script>
</body>
</html>
