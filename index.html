<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Castro Elétrons - Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#070E1A;color:#E2EAF4;min-height:100vh}
        :root{--bg:#070E1A;--surface:#0D1B2E;--primary:#00E5A0;--accent:#F59E0B;--danger:#EF4444;--muted:#5A7A9A;--border:rgba(0,229,160,0.15);--radius:12px}
        
        #login-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
        .login-box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px 28px}
        .login-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:32px}
        .bolt-icon{width:56px;height:56px;background:rgba(0,229,160,0.1);border:2px solid var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px}
        .login-logo h1{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;letter-spacing:3px}
        
        #app{display:none;flex-direction:column;min-height:100vh}
        .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:11px 15px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
        .topbar-brand{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;letter-spacing:2px;color:var(--primary)}
        
        .main-content{flex:1;padding-bottom:76px}
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:50}
        .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:9px 4px 11px;cursor:pointer;color:var(--muted);font-size:9px;gap:3px;background:none;border:none}
        .nav-btn.active{color:var(--primary)}
        
        .screen{display:none;padding:14px}
        .screen.active{display:block}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
        .field{margin-bottom:14px}
        .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
        .field input{width:100%;padding:11px 13px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:#E2EAF4;font-size:14px;outline:none}
        
        .btn{padding:11px 14px;border-radius:var(--radius);font-size:12px;font-weight:600;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:5px;width:100%}
        .btn-green{background:var(--primary);color:#000}
        .btn-outline{background:none;border:1px solid var(--border);color:var(--primary)}
        .btn-danger{background:rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); margin-top: 10px}
        
        .item-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
        .stock-low{color: var(--danger) !important; font-weight: bold; animation: pulse 2s infinite}
        @keyframes pulse { 0% {opacity:1} 50% {opacity:0.5} 100% {opacity:1} }

        .price-box{background:linear-gradient(135deg,rgba(0,229,160,0.1),transparent);border:1px solid var(--primary);border-radius:var(--radius);padding:14px;margin:10px 0;display:none}
        .price-box.show{display:block}
        .price-val{font-family:'Rajdhani',sans-serif;font-size:28px;font-weight:700;color:var(--primary)}
        
        .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;display:none;align-items:flex-end;justify-content:center}
        .modal-bg.show{display:flex}
        .modal{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:22px 18px;width:100%}

        .toast{position:fixed;top:65px;left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:8px;font-size:12px;z-index:999;opacity:0;transition:0.3s; pointer-events:none}
        .toast.show{opacity:1}
        .toast.ok{background:var(--primary);color:#000}
        .toast.err{background:var(--danger);color:#fff}
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <div class="login-logo"><div class="bolt-icon">⚡</div><h1>CASTRO ELÉTRONS</h1></div>
        <div class="field"><label>USUÁRIO</label><input type="text" id="lu" placeholder="Gabriel27"></div>
        <div class="field"><label>SENHA</label><input type="password" id="ls" placeholder="********"></div>
        <button class="btn btn-green" onclick="login()">ENTRAR NO SISTEMA</button>
    </div>
</div>

<div id="app">
    <div class="topbar">
        <div class="topbar-brand">⚡ CASTRO ELÉTRONS</div>
        <button onclick="sair()" style="background:none; border:1px solid var(--border); color:var(--muted); padding:5px 10px; border-radius:8px; font-size:11px;">SAIR</button>
    </div>

    <div class="main-content">
        <div class="screen active" id="sc-venda">
            <div style="display:flex;gap:8px;margin-bottom:14px">
                <button class="btn btn-green" id="tab-calc" onclick="aba('calc')" style="flex:1">CADASTRAR</button>
                <button class="btn btn-outline" id="tab-cart" onclick="aba('cart')" style="flex:1">CARRINHO <span id="badge"></span></button>
            </div>

            <div id="p-calc">
                <div class="card">
                    <div class="field"><label>NOME DO PRODUTO</label><input type="text" id="c-nome" placeholder="Ex: Smartwatch D20"></div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                        <div class="field"><label>Custo R$</label><input type="number" id="c-custo" oninput="calc()"></div>
                        <div class="field"><label>Estoque Inicial</label><input type="number" id="c-qtd-ini" value="1"></div>
                    </div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;">
                        <div class="field"><label>Frete</label><input type="number" id="c-frete" oninput="calc()"></div>
                        <div class="field"><label>Taxa %</label><input type="number" id="c-taxa" oninput="calc()"></div>
                        <div class="field"><label>Lucro %</label><input type="number" id="c-lucro" oninput="calc()"></div>
                    </div>
                </div>
                <div class="price-box" id="price-box">
                    <div style="font-size:11px;color:var(--muted)">PREÇO DE VENDA</div>
                    <div class="price-val" id="price-val">R$ 0,00</div>
                </div>
                <button class="btn btn-green" id="btn-salvar" onclick="salvar()" disabled style="margin-bottom:20px">SALVAR NO ESTOQUE</button>
                <div id="lista-cat"></div>
            </div>

            <div id="p-cart" style="display:none">
                <div class="card">
                    <div class="field"><label>CLIENTE</label><input type="text" id="c-cliente" placeholder="Nome"></div>
                    <div class="field"><label>WHATSAPP</label><input type="tel" id="c-wpp" placeholder="91988887777"></div>
                </div>
                <div id="cart-lista"></div>
                <div id="atend-lista"></div>
                <button class="btn btn-outline" onclick="abrirAtend()" style="margin-top:10px; border-color:var(--accent); color:var(--accent);">+ ADICIONAR SERVIÇO TÉCNICO</button>
                
                <div id="total-bar" class="card" style="margin-top:15px; border-color:var(--primary); display:none">
                    <div style="display:flex; justify-content:space-between; font-weight:bold"><span>TOTAL</span><span id="t-total">R$ 0,00</span></div>
                    <button class="btn btn-green" onclick="finalizar()" style="margin-top:15px">FINALIZAR E ENVIAR</button>
                </div>
            </div>
        </div>

        <div class="screen" id="sc-estoque"><div id="lista-est"></div></div>
        <div class="screen" id="sc-pedidos"><div id="lista-ped"></div></div>
        <div class="screen" id="sc-rel">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:20px">
                <button class="btn btn-outline" onclick="gerarRelatorio(30)">MENSAL</button>
                <button class="btn btn-outline" onclick="gerarRelatorio(180)">SEMESTRAL</button>
            </div>
            <div id="rel-resultado"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" id="nav-venda" onclick="nav('venda')"><span>💰</span>Venda</button>
        <button class="nav-btn" id="nav-estoque" onclick="nav('estoque')"><span>📦</span>Estoque</button>
        <button class="nav-btn" id="nav-pedidos" onclick="nav('pedidos')"><span>📑</span>Pedidos</button>
        <button class="nav-btn" id="nav-rel" onclick="nav('rel')"><span>📊</span>Relatório</button>
    </nav>
</div>

<div class="modal-bg" id="m-atend">
    <div class="modal">
        <h3 style="margin-bottom:15px">Serviço Técnico</h3>
        <div class="field"><label>DESCRIÇÃO</label><input type="text" id="a-desc" placeholder="Ex: Formatação"></div>
        <div class="field"><label>VALOR R$</label><input type="number" id="a-val" placeholder="0.00"></div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
            <button class="btn btn-outline" onclick="fechar('m-atend')">CANCELAR</button>
            <button class="btn btn-green" onclick="addAtend()">ADICIONAR</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient('https://unhjleupkfimqqngazpa.supabase.co', 'sb_publishable_1PCUdcINjEA0NVksJez-QA_ZkbdY_8W');
let cat = [], cart = [], atends = [], precoSugerido = 0;

async function login() {
    const u = document.getElementById('lu').value;
    const s = document.getElementById('ls').value;
    const { data } = await sb.from('usuarios').select().eq('usuario', u).eq('senha', s).single();
    if(data) { document.getElementById('login-screen').style.display='none'; document.getElementById('app').style.display='flex'; loadCat(); }
    else toast('Acesso negado!', 'err');
}

function nav(t) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('active'));
    document.getElementById('sc-'+t).classList.add('active');
    document.getElementById('nav-'+t).classList.add('active');
    if(t === 'estoque') loadEst();
    if(t === 'pedidos') loadPeds();
}

function aba(t) {
    document.getElementById('p-calc').style.display = t==='calc' ? 'block' : 'none';
    document.getElementById('p-cart').style.display = t==='cart' ? 'block' : 'none';
    if(t==='cart') renderCart();
}

function calc() {
    const custo = parseFloat(document.getElementById('c-custo').value) || 0;
    const frete = parseFloat(document.getElementById('c-frete').value) || 0;
    const taxa = (parseFloat(document.getElementById('c-taxa').value) || 0)/100;
    const lucro = (parseFloat(document.getElementById('c-lucro').value) || 0)/100;
    const divisor = 1 - (taxa + lucro);
    if(divisor > 0) {
        precoSugerido = (custo + frete) / divisor;
        document.getElementById('price-val').textContent = f(precoSugerido);
        document.getElementById('price-box').classList.add('show');
        document.getElementById('btn-salvar').disabled = false;
    }
}

async function salvar() {
    const nome = document.getElementById('c-nome').value.toUpperCase();
    const qtd = parseInt(document.getElementById('c-qtd-ini').value) || 0;
    
    const { error } = await sb.from('produtos').insert({
        nome, 
        preco_venda: precoSugerido, 
        quantidade: qtd,
        custo: parseFloat(document.getElementById('c-custo').value) || 0,
        frete: parseFloat(document.getElementById('c-frete').value) || 0,
        taxa_percent: parseFloat(document.getElementById('c-taxa').value) || 0,
        lucro_percent: parseFloat(document.getElementById('c-lucro').value) || 0
    });

    if(!error) { 
        toast('Salvo com sucesso!', 'ok'); 
        loadCat(); 
        ['c-nome','c-custo','c-frete','c-taxa','c-lucro'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('price-box').classList.remove('show');
    } else {
        console.error(error);
        toast('Erro ao salvar!', 'err');
    }
}

async function loadCat() {
    const { data } = await sb.from('produtos').select().order('nome');
    cat = data || [];
    document.getElementById('lista-cat').innerHTML = cat.map(p => `
        <div class="item-row">
            <span>${p.nome} (${p.quantidade} un)</span>
            <button class="btn btn-green" onclick="addCart('${p.id}')" style="width:40px; height:30px">+</button>
        </div>
    `).join('');
}

async function loadEst() {
    const { data } = await sb.from('produtos').select().order('quantidade');
    document.getElementById('lista-est').innerHTML = data.map(p => `
        <div class="card" style="display:flex; justify-content:space-between; align-items:center">
            <div><strong>${p.nome}</strong><br><small>Venda: ${f(p.preco_venda)}</small></div>
            <div class="${p.quantidade < 3 ? 'stock-low' : ''}" style="text-align:right">
                ${p.quantidade} <small>un</small>
            </div>
        </div>
    `).join('');
}

function addCart(id) {
    const p = cat.find(x => x.id === id);
    if(p.quantidade <= 0) return toast('Sem estoque!', 'err');
    cart.push(p);
    document.getElementById('badge').textContent = `(${cart.length})`;
    toast('No carrinho!', 'ok');
}

function addAtend() {
    const d = document.getElementById('a-desc').value;
    const v = parseFloat(document.getElementById('a-val').value) || 0;
    if(d && v) { atends.push({descricao: d, valor: v}); fechar('m-atend'); renderCart(); }
}

function renderCart() {
    const div = document.getElementById('cart-lista');
    const divAtend = document.getElementById('atend-lista');
    div.innerHTML = cart.map((i, idx) => `<div class="item-row"><span>${i.nome}</span><span>${f(i.preco_venda)}</span></div>`).join('');
    divAtend.innerHTML = atends.map(a => `<div class="item-row" style="color:var(--accent)"><span>🔧 ${a.descricao}</span><span>${f(a.valor)}</span></div>`).join('');
    
    const total = cart.reduce((s, i) => s + i.preco_venda, 0) + atends.reduce((s, a) => s + a.valor, 0);
    document.getElementById('t-total').textContent = f(total);
    document.getElementById('total-bar').style.display = (cart.length || atends.length) ? 'block' : 'none';
}

async function finalizar() {
    const cliente = document.getElementById('c-cliente').value;
    const numRaw = document.getElementById('c-wpp').value.replace(/\D/g,'');
    const total = cart.reduce((s, i) => s + i.preco_venda, 0) + atends.reduce((s, a) => s + a.valor, 0);
    
    const { data, error } = await sb.from('pedidos').insert({
        cliente_nome: cliente, total_venda: total, status: 'ok'
    }).select().single();

    if(!error) {
        for(let item of cart) {
            const { data: pAtual } = await sb.from('produtos').select('quantidade').eq('id', item.id).single();
            await sb.from('produtos').update({ quantidade: pAtual.quantidade - 1 }).eq('id', item.id);
        }
        const msg = `🚀 *CASTRO ELÉTRONS* 🚀\n\nOlá *${cliente}*, pedido confirmado!\n\n*ITENS:*\n${cart.map(i => '✅ '+i.nome).join('\n')}\n${atends.map(a => '🔧 '+a.descricao).join('\n')}\n\n*TOTAL: ${f(total)}*\n\nQual a melhor forma de pagamento?`;
        window.open(`https://wa.me/55${numRaw}?text=${encodeURIComponent(msg)}`);
        cart = []; atends = []; document.getElementById('badge').textContent = '';
        aba('calc');
    }
}

async function loadPeds() {
    const { data } = await sb.from('pedidos').select().order('criado_em', {ascending: false});
    document.getElementById('lista-ped').innerHTML = data.map(p => `
        <div class="card">
            <div style="display:flex; justify-content:space-between"><strong>${p.cliente_nome}</strong><span style="color:var(--primary)">${f(p.total_venda)}</span></div>
            <button class="btn btn-danger" onclick="apagarPedido('${p.id}')" style="padding:5px; height:auto; font-size:10px">APAGAR PEDIDO</button>
        </div>
    `).join('');
}

async function apagarPedido(id) {
    if(confirm('Apagar pedido?')) { await sb.from('pedidos').delete().eq('id', id); loadPeds(); }
}

async function gerarRelatorio(dias) {
    const dataLimite = new Date();
    dataLimite.setDate(dataLimite.getDate() - dias);
    const { data } = await sb.from('pedidos').select().gte('criado_em', dataLimite.toISOString());
    const total = data.reduce((s, p) => s + p.total_venda, 0);
    document.getElementById('rel-resultado').innerHTML = `<div class="card"><div style="font-size:11px; color:var(--muted)">RESULTADO</div><div style="font-size:24px; font-weight:bold; color:var(--primary)">${f(total)}</div></div>`;
}

function f(v) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v); }
function toast(m, t) { const el = document.getElementById('toast'); el.textContent = m; el.className = `toast ${t} show`; setTimeout(() => el.classList.remove('show'), 3000); }
function abrirAtend() { document.getElementById('m-atend').classList.add('show'); }
function fechar(id) { document.getElementById(id).classList.remove('show'); }
function sair() { location.reload(); }
</script>
</body>
</html>
